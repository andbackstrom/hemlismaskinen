<!doctype html><html lang="sv"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>HEMLISMASKINEN</title><style>
:root{--bg:#050805;--panel:#071007;--fg:#b7ffb7;--green:#33ff66;--cyan:#48d9ff;--muted:#719474;--line:#245c2d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.7 'Courier New',monospace;background-image:radial-gradient(ellipse at 80% 0,#15381b66,transparent 50%),linear-gradient(#33ff6608 1px,transparent 1px);background-size:auto,100% 4px}body:after{content:'';position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(transparent 0 3px,#0002 3px 4px)}a{color:inherit;text-decoration:none}button,input,textarea{font:inherit}button,a,input,textarea{outline-offset:5px}button{cursor:pointer;color:var(--fg);background:transparent;border:1px solid var(--line);padding:11px 17px}button:hover,button.active,.primary{background:var(--green);border-color:var(--green);color:#041004}.shell{max-width:1180px;margin:32px auto;border:1px solid var(--line);box-shadow:0 0 70px #33ff6609}header{display:flex;align-items:center;justify-content:space-between;padding:18px 26px;border-bottom:1px solid var(--line);gap:20px}.brand{font-weight:bold;color:var(--green);letter-spacing:2px}.signal{font-size:11px;color:var(--green)}.signal:before{content:'●';margin-right:9px}nav{display:flex;padding:12px 26px;gap:8px;border-bottom:1px solid var(--line);flex-wrap:wrap}nav a{padding:7px 12px;font-size:11px;letter-spacing:1px}nav a:hover,nav a.active{background:#33ff6617;color:var(--green)}main{padding:48px 44px 60px}.eyebrow{color:var(--cyan);font-size:11px;letter-spacing:3px}h1{font-size:clamp(40px,6vw,76px);line-height:1.05;letter-spacing:-4px;margin:24px 0;color:var(--green);font-weight:900}h1 span{color:var(--fg)}.intro{max-width:510px;color:var(--muted);font-size:15px}.hero{display:flex;gap:30px;align-items:center;justify-content:space-between;padding-bottom:48px}.glyph{font-size:14px;line-height:1.25;white-space:pre;color:var(--green);text-shadow:0 0 20px #33ff6650;opacity:.8;user-select:none}.strip{border-block:1px solid var(--line);display:flex;gap:30px;padding:14px 0;font-size:10px;letter-spacing:1px;color:var(--muted);flex-wrap:wrap}.strip b{color:var(--green)}.grid{display:grid;grid-template-columns:1.2fr 1fr;gap:34px;margin-top:35px}.section-head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:18px}h2{font-size:13px;color:var(--cyan);font-weight:normal;letter-spacing:1px;margin:0}.count{font-size:11px;color:var(--muted)}.box{border:1px solid var(--line);padding:26px;background:#071007b0}.box h2{margin-bottom:16px;color:var(--green)}label{display:block;font-size:11px;color:var(--muted);margin:20px 0 7px}input,textarea{width:100%;background:#030803;color:var(--fg);border:1px solid var(--line);padding:12px;border-radius:0}textarea{min-height:160px;resize:vertical}input:focus,textarea:focus{outline:1px solid var(--green)}.helper{font-size:11px;color:var(--muted);margin:10px 0 20px}.formfoot{display:flex;align-items:center;justify-content:space-between;gap:12px}.empty{padding:50px 24px;border:1px dashed var(--line);text-align:center;color:var(--muted)}.empty strong{display:block;color:var(--fg);font-size:17px;font-weight:normal;margin-bottom:8px}.secret{padding:24px 0;border-bottom:1px dashed var(--line)}.secret .body{font-size:17px;color:var(--fg);white-space:pre-wrap;overflow-wrap:anywhere;margin:13px 0 18px}.meta{font-size:10px;letter-spacing:1px;color:var(--muted);display:flex;justify-content:space-between;gap:12px}.alias{color:var(--green)}.login{max-width:440px;margin:20px auto}.login h1{font-size:44px;letter-spacing:-2px}.login .primary{width:100%;margin-top:22px}.message{font-size:12px;white-space:pre-wrap;color:var(--cyan);margin-top:16px}.error{color:#ff8585}footer{padding:17px 26px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:15px;font-size:10px;color:var(--muted);flex-wrap:wrap}.privacy{max-width:760px}.privacy h1{font-size:55px}.privacy h2{margin-top:32px;color:var(--green)}.privacy p{color:var(--muted)}.actions{display:flex;gap:10px}.reject{color:#ff8585}.mini{font-size:11px}.logout{margin-left:auto}.hidden{display:none!important}@media(max-width:760px){.shell{margin:10px}.hero{display:block}.glyph{display:none}main{padding:35px 20px}.grid{grid-template-columns:1fr}.composer{grid-row:1}header{padding:16px}.signal{font-size:9px}nav{padding:10px}h1{letter-spacing:-2px}.strip{gap:15px}.box{padding:20px}}
</style><div class="shell"><header><a class="brand" href="/">[ H/M ]</a><span class="signal">HEMLISMASKINEN // PRIVATE FREQUENCY</span></header><nav><a href="/" id="boardnav">[01] HEMLISAR</a><a href="/anonymitet" id="privacynav">[02] ANONYMITET</a><a href="/admin" id="adminnav">[03] ADMIN</a><button class="logout mini hidden" id="logout">LÅS TERMINALEN ↗</button></nav><main id="app"></main><footer><span>HEMLIS.ANDREAS.QUEST</span><span>INGEN ANALYS. INGA PIXLAR. BARA HEMLISAR.</span><span>SYS_V.01</span></footer></div>
<script>
let role=null;const app=document.querySelector('#app');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,data){const r=await fetch('/api/'+path,{method:data?'POST':'GET',headers:data?{'Content-Type':'application/json'}:{},body:data?JSON.stringify(data):undefined,cache:'no-store'});const v=await r.json();if(!r.ok)throw Error(v.error||'Något gick fel. Försök igen.');return v}
function message(form,text,error=false){const el=form.querySelector('.message');el.textContent=text;el.classList.toggle('error',error)}
function privacy(){app.innerHTML=`<div class="privacy"><div class="eyebrow">[ PROTOKOLL 02 / ANONYMITET ]</div><h1>Din hemlis.<br><span>Ingen profil.</span></h1><p>Du behöver inget konto för att lämna en hemlis. Ett gemensamt lösenord öppnar boardet. Ett alias är bara en text du själv väljer.</p><h2>01 / DET HÄR SPARAS</h2><p>Hemlisens text, valt alias och datumet då du skickar in den. Dessutom en slumpad identifierare och om den är godkänd. Originaldatum och alias visas vid publicering.</p><h2>02 / DET HÄR SAMLAR APPEN INTE IN</h2><p>Inga IP-adresser, e-postadresser, besökarprofiler, webbläsarfingeravtryck eller analysdata sparas av appen. Inga externa typsnitt, spårningspixlar eller tredjepartsskript laddas. Appens åtkomstloggar är avstängda.</p><h2>03 / EN KAKA FÖR LÅSET</h2><p>En nödvändig, signerad sessionskaka håller terminalen upplåst i högst åtta timmar. Den innehåller behörighet och sluttid, ingen personlig identitet. Den delas av behörighetsnivån och används inte för spårning. Lås terminalen när du är klar.</p><h2>04 / MODERERING UTAN AVSÄNDARE</h2><p>Andreas kan godkänna eller rata inskickade hemlisar. Panelen visar endast text, alias och inskickningsdatum. Ratade hemlisar raderas ur den aktiva databasen. Godkännande ändrar inte originaldatumet.</p><h2>05 / ANONYMITET HAR GRÄNSER</h2><p>Ingen webbtjänst kan lova total anonymitet. Din internetleverantör och infrastrukturen som transporterar trafiken kan se anslutningsuppgifter. TLS skyddar transporten, men infrastrukturen kan behandla tekniska metadata. Driftleverantörens loggar och säkerhetskopior måste hanteras separat. Det gemensamma lösenordet gör inte innehållet krypterat för administratören.</p><p>Skriv inte ditt riktiga namn eller detaljer som identifierar dig eller någon annan. Alias, exakt datum och själva berättelsen kan avslöja vem du är. Använd ett nytt alias eller lämna fältet tomt. Den som har boardets lösenord kan läsa publicerade hemlisar.</p></div>`}
function login(admin=false){app.innerHTML=`<div class="login"><div class="eyebrow">[ ${admin?'ADMIN ACCESS':'SLUTEN FREKVENS'} ]</div><h1>${admin?'Hej, andreas.':'Vissa saker<br>stannar här.'}</h1><p class="intro">${admin?'Logga in för att godkänna eller rata hemlisar.':'Ett anonymt board för det du inte säger högt. Lås upp för att läsa och lämna en hemlis.'}</p><form id="login"><label for="password">${admin?'ADMINLÖSENORD':'GEMENSAMT LÖSENORD'}</label><input id="password" type="password" autocomplete="${admin?'current-password':'off'}" required maxlength="200"><button class="primary">${admin?'ÖPPNA MODERERING':'LÅS UPP TERMINALEN'} →</button><div class="message" role="status"></div></form><p class="helper">${admin?'KONTO: andreas':'Inget konto. Ingen e-post. Inga besökarprofiler.'}</p></div>`;document.querySelector('#login').onsubmit=async e=>{e.preventDefault();const f=e.target,b=f.querySelector('button');b.disabled=true;try{const v=await api('login',{password:f.querySelector('input').value,...(admin?{username:'andreas'}:{})});role=v.role;render()}catch(err){message(f,err.message,true)}finally{b.disabled=false}}}
function cards(items,admin){return items.map(x=>`<article class="secret"><div class="meta"><span class="alias">${esc(x.name)}</span><time datetime="${esc(x.created_at)}">${esc(new Date(x.created_at).toLocaleString('sv-SE',{timeZone:'Europe/Stockholm'}))}</time></div><p class="body">${esc(x.body)}</p>${admin?`<div class="actions"><button class="primary" data-id="${x.id}" data-action="approve">GODKÄNN ↗</button><button class="reject" data-id="${x.id}" data-action="reject">RATA ×</button></div>`:''}</article>`).join('')}
async function load(admin){const list=document.querySelector('#list');try{const items=await api(admin?'pending':'secrets');document.querySelector('#count').textContent=String(items.length).padStart(2,'0');list.innerHTML=cards(items,admin)||`<div class="empty"><strong>${admin?'Kön är tom.':'Tystnad före hemlisen.'}</strong>${admin?'Alla hemlisar är hanterade.':'Den första godkända hemlisen hamnar här.'}</div>`;if(admin)list.onclick=async e=>{const b=e.target.closest('[data-action]');if(!b)return;b.disabled=true;try{await api('moderate',{id:b.dataset.id,action:b.dataset.action});await load(true)}catch(err){document.querySelector('#modmessage').textContent=err.message;b.disabled=false}}}catch(err){list.textContent=err.message}}
function board(admin){app.innerHTML=`<div class="hero"><div><div class="eyebrow">[ ${admin?'MODERATOR / ANDREAS':'ANONYM ANSLAGSTAVLA'} ]</div><h1>${admin?'Bakom<br><span>kulisserna.</span>':'Lätta på<br><span>hemligheten.</span>'}</h1><p class="intro">${admin?'Godkänn eller rata. Inga profiler. Inga avsändaruppgifter. Bara det som skickats in.':'Det du bär på. Det ingen vet. Skriv av dig och försvinn i bruset.'}</p></div><div class="glyph" aria-hidden="true">       ░░▒▒▓▓████▓▓▒▒░░
    ░▒▓██              ██▓▒░
   ▒██    ┌──────────┐    ██▒
   ▓█     │ ▪      ▪ │     █▓
   ▓█     │  ──────  │     █▓
   ▒██    └────┬─────┘    ██▒
    ░▒▓██      │       ██▓▒░
       ░░▒▒▓▓████▓▓▒▒░░
           [REDACTED]</div></div><div class="strip"><span><b>●</b> ${admin?'MODERERING AKTIV':'ANONYM INLÄMNING'}</span><span>INGA BESÖKARPROFILER</span><span>ALLT MODERERAS</span></div><div class="${admin?'':'grid'}"><section style="margin-top:${admin?'32px':'0'}"><div class="section-head"><h2>> ${admin?'VÄNTAR PÅ BESLUT':'GODKÄNDA HEMLISAR'}</h2><span class="count" id="count">--</span></div><div id="list" aria-live="polite">Hämtar…</div><div class="message" id="modmessage" role="status"></div></section>${admin?'':`<section class="composer box"><h2>> LÄMNA EN HEMLIS</h2><p class="helper">Ingen behöver veta att det var du.</p><form id="submit"><label for="name">ALIAS / VALFRITT</label><input id="name" maxlength="40" placeholder="Anonym" autocomplete="off"><label for="body">DIN HEMLIS</label><textarea id="body" maxlength="2000" required placeholder="Jag har aldrig berättat att…"></textarea><div class="formfoot"><span class="helper" id="chars">0 / 2000</span><button class="primary">SKICKA →</button></div><div class="message" role="status"></div><p class="helper">Granskas före publicering. Ditt alias och inskickningsdatum visas. Undvik detaljer som kan identifiera någon.</p></form></section>`}</div>`;load(admin);if(!admin){const form=document.querySelector('#submit');form.querySelector('textarea').oninput=e=>document.querySelector('#chars').textContent=e.target.value.length+' / 2000';form.onsubmit=async e=>{e.preventDefault();const b=form.querySelector('button');b.disabled=true;try{await api('secrets',{name:form.querySelector('input').value,body:form.querySelector('textarea').value});form.reset();document.querySelector('#chars').textContent='0 / 2000';message(form,'Mottagen. Din hemlis väntar på godkännande.')}catch(err){message(form,err.message,true)}finally{b.disabled=false}}}}
function render(){document.querySelector('#logout').classList.toggle('hidden',!role);document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('active',new URL(a.href).pathname===location.pathname));if(location.pathname==='/anonymitet')privacy();else if(location.pathname==='/admin'){if(role==='admin')board(true);else login(true)}else if(role)board(false);else login(false)}
document.querySelector('#logout').onclick=async()=>{try{await api('logout',{});role=null;render()}catch(err){app.textContent=err.message}};api('session').then(v=>{role=v.role;render()}).catch(()=>{app.textContent='Kunde inte ansluta. Ladda om sidan.'});
</script></html>
