name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python syntax
        run: python3 -m py_compile server.py test_handlers.py test_flow.py test_music.py
      - name: Run isolated authorization and HTTP tests
        run: python3 -m unittest -v test_handlers.py test_flow.py test_music.py
      - name: Validate container configuration with synthetic values
        run: |
          printf 'BOARD_PASSWORD=ci-board-only\nADMIN_PASSWORD=ci-admin-only\nSESSION_SECRET=ci-session-only\n' > .env
          docker compose config --quiet
